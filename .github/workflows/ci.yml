name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lock-check:
    name: Lock file consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv lock --check

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run ruff check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run mypy src

  test-unit:
    name: Test (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run pytest tests/unit --cov=domoai --cov-report=term-missing --cov-report=xml --junitxml=junit-unit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-unit
          path: junit-unit.xml
          if-no-files-found: ignore

  test-contract:
    name: Test (contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run pytest tests/contract --junitxml=junit-contract.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-contract
          path: junit-contract.xml
          if-no-files-found: ignore

  test-integration:
    name: Test (integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run pytest tests/integration --junitxml=junit-integration.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-integration
          path: junit-integration.xml
          if-no-files-found: ignore

  test-performance:
    name: Test (performance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run pytest tests/performance --junitxml=junit-performance.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-performance
          path: junit-performance.xml
          if-no-files-found: ignore

  test-composition:
    name: Test (composition)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      # ubuntu-latest ships a running Docker daemon; the one Docker-backed
      # composition test (real Mosquitto via Testcontainers) skips itself if
      # it isn't reachable, so this job stays green on runners without
      # Docker instead of failing the build.
      - run: uv run pytest tests/composition --junitxml=junit-composition.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-composition
          path: junit-composition.xml
          if-no-files-found: ignore

  package:
    name: Package build and entrypoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv build
      - run: uv run python -c "import domoai.mcp.stdio; import domoai.lab.cli"

  schema-check:
    name: Schema freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run python3 scripts/export_schemas.py
      - run: git diff --exit-code schemas/v1/

  contract-docs:
    name: Runtime contract documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run python scripts/export_schemas.py
      - run: uv run python scripts/check_runtime_contract_docs.py

  architecture:
    name: Source architecture invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run python scripts/check_architecture_contracts.py

  import-linter-diagnostic:
    name: Import Linter (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run lint-imports

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run --with pip-audit pip-audit --local

  required-release-gates:
    name: Required release gates
    if: always()
    needs:
      - lock-check
      - lint
      - typecheck
      - test-unit
      - test-contract
      - test-integration
      - test-performance
      - test-composition
      - package
      - schema-check
      - contract-docs
      - architecture
      - import-linter-diagnostic
      - dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Require every release gate
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "gate results: ${RESULTS}"
          case ",${RESULTS}," in
            *,failure,*|*,cancelled,*|*,skipped,*)
              echo "one or more required release gates did not pass" >&2
              exit 1
              ;;
          esac

  # Closes P2.4 (spec 149): a single, SHA-tagged evidence bundle so
  # "the tests pass" is a downloadable artifact tied to this exact commit,
  # not a claim in a README that may predate the commit it's cited for.
  # Runs after every other job (`if: always()` so it still runs, and still
  # records the truth, when something upstream failed) and never itself
  # fails the build -- it is a report, not a gate.
  evidence-summary:
    name: CI evidence summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lock-check
      - lint
      - typecheck
      - test-unit
      - test-contract
      - test-integration
      - test-performance
      - test-composition
      - package
      - schema-check
      - contract-docs
      - architecture
      - import-linter-diagnostic
      - dependency-audit
      - required-release-gates
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: evidence
          pattern: "junit-*"
          merge-multiple: true
        continue-on-error: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: evidence
          pattern: "coverage-report"
          merge-multiple: true
        continue-on-error: true
      - name: Write evidence-summary.json
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          cat <<EOF > evidence/evidence-summary.json
          {
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "workflow_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "job_results": ${NEEDS_JSON}
          }
          EOF
          cat evidence/evidence-summary.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: warn
