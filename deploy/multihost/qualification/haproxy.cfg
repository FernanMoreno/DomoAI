# NOT FOR PRODUCTION: internal-only writer route for the disposable qualification lab.
global
    maxconn 256

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend postgres_writer
    bind :5432
    default_backend patroni_primary

backend patroni_primary
    # Patroni returns 200 only from the writable primary endpoint.
    option httpchk GET /primary
    http-check expect status 200
    server postgres-1 postgres-1:5432 check port 8008
    server postgres-2 postgres-2:5432 check port 8008
    server postgres-3 postgres-3:5432 check port 8008
