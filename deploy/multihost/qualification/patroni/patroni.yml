# NOT FOR PRODUCTION: the lab has no TLS, production identities, backups, or fault domains.
# Node-specific identity and advertised addresses are supplied by Compose's PATRONI_* variables.
scope: domoai-qualification-lab
namespace: /service/

etcd3:
  hosts: etcd-1:2379,etcd-2:2379,etcd-3:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    synchronous_mode: true
    synchronous_mode_strict: true
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        synchronous_commit: "on"
  initdb:
    - encoding: UTF8
    - data-checksums
  pg_hba:
    # Deliberately unauthenticated network transport is limited to this disposable lab network.
    - host all all 0.0.0.0/0 md5
    - host replication replicator 0.0.0.0/0 md5

postgresql:
  data_dir: /var/lib/postgresql/data/patroni
  bin_dir: /usr/lib/postgresql/16/bin
  authentication:
    superuser:
      username: postgres
      password: lab-only-postgres-password
    replication:
      username: replicator
      password: lab-only-replication-password
  parameters:
    shared_buffers: 128MB
    max_connections: 100
