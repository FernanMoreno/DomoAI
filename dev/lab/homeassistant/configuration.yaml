default_config:

homeassistant:
  name: DomoAI Virtual Lab
  unit_system: metric
  time_zone: Europe/Madrid

input_boolean:
  virtual_living_room_light:
    name: Virtual Living Room Light
  virtual_pump:
    name: Virtual Pump

input_number:
  virtual_temperature:
    name: Virtual Temperature
    min: 0
    max: 40
    step: 0.1
    initial: 21.5
  virtual_humidity:
    name: Virtual Humidity
    min: 0
    max: 100
    step: 0.1
    initial: 45

template:
  - switch:
      - name: Virtual Living Room Switch
        unique_id: domoai_virtual_living_room_switch
        state: "{{ is_state('input_boolean.virtual_living_room_light', 'on') }}"
        turn_on:
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.virtual_living_room_light
        turn_off:
          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.virtual_living_room_light
  - sensor:
      - name: Virtual Temperature Sensor
        unique_id: domoai_virtual_temperature_sensor
        unit_of_measurement: "°C"
        state: "{{ states('input_number.virtual_temperature') }}"
      - name: Virtual Humidity Sensor
        unique_id: domoai_virtual_humidity_sensor
        unit_of_measurement: "%"
        state: "{{ states('input_number.virtual_humidity') }}"
