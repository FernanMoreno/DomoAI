[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "domoai"
version = "0.1.0"
description = "Universal agentic domotics runtime and general MCP interface"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiomqtt>=2.5,<3",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "mcp>=1.27,<3",
    "ortools>=9.12,<10",
    "pebble>=5.1,<6",
    "pydantic>=2.11,<3",
    "pymodbus>=3.9,<4",
    "xknx>=3.16,<4",
    "websockets>=15,<16",
]

[project.scripts]
domoai-mcp = "domoai.mcp.stdio:main"
domoai-lab = "domoai.lab.cli:main"
domoai-hil = "domoai.hil.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
    "testcontainers>=4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/domoai"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "composition: cross-boundary tests against real disposable dependencies (Testcontainers); requires Docker",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["domoai"]
mypy_path = "src"
